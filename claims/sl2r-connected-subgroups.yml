id: sl2r-connected-subgroups
statement: >
  Every connected Lie subgroup H of SL(2,R) is, up to conjugacy,
  exactly one of {e}; K = SO(2), A (positive diagonals), or N (upper
  unipotents) - three one-parameter classes distinguished by the sign
  of det of the generator; the Borel identity component AN; or
  SL(2,R) itself. Hence dim G/H is 3, 2, 1, or 0 respectively, dim
  G/H = 3 iff H is discrete, and a connected H != {e} kills exactly
  one Iwasawa stage iff dim H = 1, two iff H is conjugate to AN, three
  iff H = G. This replaces iwasawa-one-stage-original; the source's
  dimension-3 conclusion uses only the dim H >= 1 part.
premises: []
prediction: P-3
evidence:
  - kind: proof
    ref: "notes/p3_iwasawa.md - Lie subalgebra correspondence; Jordan form for dim 1; centraliser argument plus ad_X eigenvalues for dim 2; classical"
  - kind: computation
    ref: "scripts/verify/iwasawa_one_stage.py - 2000-sample classification of exp X by sign of det X against the closed form; AN unique a*n factorisation, closure, non-abelian; a generic one-parameter subgroup in AN conjugate to A; Iwasawa k a n reconstruction"
    method: reimplementation
null_system: "the classification is the list of Lie subalgebras of sl(2,R), a fact about a 3-dimensional Lie algebra with no coupling, stage, or physics attached; the script computes exponentials and factorisations from the matrices, not from the stage labels"
falsifier: "scripts/verify/iwasawa_one_stage.py --mutant"
novelty:
  status: classical
  citation: "subalgebras of sl(2,R): Lang, SL2(R) (1975); Kirillov, An Introduction to Lie Groups and Lie Algebras (2008)"
status: proven
