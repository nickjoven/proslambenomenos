id: holonomy-selects-the-slip-channel
statement: >
  On a free ring of N inertial sine-coupled phase oscillators with
  one pi bond, loaded by a soft-ramped dead point force at the
  antipode (J = 1, gamma = 0.02, N in {64, 96, 128}), the
  holonomy acts through a derived static strain budget and selects
  the slip channel, and nothing beyond: (1) the quasi-static fold
  of the control ring is the contact pair saturating together,
  with the closed form 2N/(N-1); the twisted ring's loop
  constraint (covariant strains summing to +-pi) de-centers the
  profile so the top bond saturates alone, at the lower fold with
  twisted/control ratio 0.96629 / 0.97782 / 0.98350 at
  N = 64 / 96 / 128 - an O(1/N) deficit; (2) the measured
  bond-slip onset ratio sits inside the registered band around the
  derived fold ratio at every N and at gamma in {0.01, 0.04}; (3)
  the first supercritical event of the control is a paired,
  winding-neutral slip through the two contact bonds, while the
  twisted ring's first event is a single slip changing the
  covariant winding by one - the two channels derived from which
  constraint binds, and observed in every registered cell; (4) the
  covariant winding lives on the half-integer lattice for the
  twisted ring (integer for control) at every settled sample, and
  the two twisted sectors are degenerate by the ring reflection
  through the pi bond, with the measured onset split below the
  one-grid-step floor. Scope: this model class and protocol; the
  supercritical cascade beyond the first event is not claimed;
  stick-slip friction and bowed strings are not touched (R-3
  settled the clamped geometry).
premises: []
prediction: P-36
evidence:
