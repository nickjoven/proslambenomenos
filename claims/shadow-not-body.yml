  respective quantum circle (exact rationals), and the affine map
  T(u,v) = ((u+1)/2, (v+1)/2) carries one extreme set onto the
  other; the CHSH quantum circle is achieved constructively by
  closed-form singlet settings at machine epsilon, with disc
  completeness imported (LC-32). Scope: these two scenarios and
  these invariants; facet-level combinatorics is not computed and
  not claimed.
