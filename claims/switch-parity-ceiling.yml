id: switch-parity-ceiling
statement: >
  In the three-switch GHZ scenario of van der Lugt & Ormrod
  (X-controlled quantum switches, GHZ-entangled controls, targets
  |0>, measure-and-reprepare interventions, Y measurement on the
  outgoing control), computed by our own simulation: the four
  registered parity implications hold POSSIBILISTICALLY - the
  forbidden events carry probability mass zero at the amplitude
  level, with the allowed outcomes uniform at 1/32 (XXX pattern)
  and 1/8 (each Y pattern) - while exhaustive enumeration of all
  4096 deterministic local-order strategies shows at most 3 of
  the 4 conditions are classically satisfiable (satisfaction
  histogram {1: 2048, 3: 2048}, odd counts only), and the Mermin
  functional built from the four patterns has classical maximum 2
  against the switch value 4, which is the algebraic ceiling. The
  no-signalling premise holds as a property of the computed data,
  and a definite-wiring control world satisfies the XXX condition
  while placing violation mass 1/2 on each Y-pattern condition -
  the contradiction lives in the coherence. Scope: this scenario
  and these observables; the reduction of definite causal order +
  relativistic causality + free choice to the enumerated class is
  IMPORTED (their Theorem 1, LC-28), so the indefiniteness
  CONCLUSION rests on that import - what is earned is the data,
  the ceiling, and their collision.
