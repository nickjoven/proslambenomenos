    method: reimplementation
null_system: "no wave floor is used - the window is placed where the slip-launched modes have decayed by more than e^{-6} at gamma 0.35 and 0.5 (R-48a: 3.7 and 2.9 at 0.8 and 1.0) (the underdamped modes at gamma/2, the overdamped k = 1 mode at omega_1^2/gamma) and the residual slow content is read from the run; the floors are the 2-Omega self floor and the describing-function correction of the stiffness band, both computed per cell; the smear identity's tolerance is the triangle inequality on the reading's own decomposition; mutants smear-blind (no smear asserted; fails at 0.7500 against 1.0 with tolerance 0.037) and band-blind (the in-band ratio asserted 1/Omega; fails at 0.448 against 0.590) perturb the instrument identity and the physics band respectively (L-13); coverage: the reimplementation carries clause (1) on an N = 16 ring in band and above and clause (3) on an N = 48 ring; the six-window decay ladder and the N = 64 cells rest on the experiment; a smear-blind mutant at N = 32 did not bite (smear 0.9 percent inside a 1.1 percent tolerance) and is recorded, not pinned; coverage (R-48a): the e^{-6} statement holds at gamma 0.35 and 0.5 (exponents 9.0 and 6.0 at Delta = 300) and not at 0.8 and 1.0 (3.7 and 2.9; residual slow_2 / A_2 of 9 and 6 percent), where the in-band cells hold inside bands 8 and 21 percent wide; the ratio sits above the band proper at gamma 0.35 and 1.0 and A_1 below its band at both above-band cells, inside by the self floor; clause (3) is the estimator's identity and its check (1) passes on any series (gate change queued, A-32); clause (2) is co-decay, not attribution; the registered cells equal the derive layer's second pass bit for bit, so the resolution is a replication (L-15); LAW-59 (A-32): check (1)'s tolerance now names its terms (the slow part's own rotor-reference phasor plus twice the self floor) and fails on a noise series; it passes the wrong site's velocity for the stated reason that the identity holds there too, with a larger slow leak"
