    ref: "scripts/experiments/p35_derive.py with p35_derive.json (the pre-registration layer: sectors, nulls, telescoping identity, the exact fold, windows); scripts/experiments/p36_channel.py with p36_channel.json (the closed form, top-only saturation, the address demotion); scripts/experiments/p35_ring.py with p35_results.json (R-33: the channel-blind detector); scripts/experiments/p36_ring.py with p36_results.json (the registered grid); independently reimplemented by scripts/verify/p36_free_ring.py with its own fold solver and velocity-Verlet integrator"
    method: reimplementation
null_system: "derived before registration: the site-mean is holonomy-blind by the telescoping identity (1e-15); the linear spectrum null is the strain window [sqrt(cos(pi/N)), 1]; the sector degeneracy is exact by reflection, making any measured split a self-calibrating instrument floor; the contact-timescale band [3.56, 5.33] is excluded from gap structure; and after R-33, the two detector responses that had been missing (net-W blindness to the paired channel; the loaded-ring address) were derived rather than patched"
falsifier: "scripts/verify/p36_free_ring.py --mutant channel-blind"
novelty:
  status: checked-novel
  litcheck: "LC-26"
  citation: "The kinematic half is classical: half-integer sectors are the half flux quantum of pi-junction loops (Bulaevskii 1977; Sigrist-Rice; Kirtley-Tsuei tricrystal and SFS pi-loop experiments) and the sector doublet is the semifluxon polarity doublet (Goldobin et al., annular 0-pi junctions). What LC-26 found unstated: the substrate-free point-load geometry (contact-pair fold 2N/(N-1), top-only saturation, the exact O(1/N) fold ratio) and the paired-vs-single first-event channel dichotomy; elementary consequences, not new physics. P-4/R-3 in-repo"
status: verified
