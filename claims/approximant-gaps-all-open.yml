    ref: "scripts/experiments/p40_derive.py with p40_registration.json (the layer: words, discriminant, labels, trace tie, validated floor); scripts/experiments/p40_gaps.py with p40_results.json (R-39: the scan detector firing); scripts/experiments/p41_gaps.py with p41_results.json (the eigen-route cells); independently reimplemented by scripts/verify/p41_gap_openings.py with its own cyclic-Jacobi eigensolver and extended-gcd labels"
