id: einstein-from-kuramoto-chain-a
statement: >
  Claim (harmonics Proof Chain A, PROOF_A_gravity.md and
  adm_dictionary.md, recorded for the refutation): from energy
  conservation and stability of coupled oscillators the Einstein
  field equations follow uniquely - at K = 1 the locked Kuramoto
  field supplies an ADM dictionary (spatial metric gamma_ij =
  <d_i theta d_j theta>, lapse N = coherence r, shift = phase gradient,
  extrinsic curvature = <(d_i d_j theta)^2>), the ADM evolution
  equations follow from differentiating the Kuramoto dynamics, and
  Lovelock's theorem then forces G + Lambda g = 8 pi G T.
premises: []
evidence:
  - kind: refutation
    ref: >
      scripts/verify/kuramoto_einstein_refutation.py and
      notes/kuramoto_einstein_refutation.md. Three independent
      failures: (1) with symmetric coupling Kuramoto is a gradient flow
      with Lyapunov function V, self-adjoint about any locked state, so
      no reversible ADM evolution is a coarse-graining of it; computed
      signature: perturbation spreading exponent 0.500 versus 0.989 for
      the --mutant inertial chain; (2) in a locked state every
      oscillator has the same frequency by definition, so the
      dictionary's lapse ("a clock at x ticks at rate r") is uniform,
      and P7 sets r = 1 outright; checked on a heterogeneous-frequency
      locked ring whose local coherence varies 0.805-1.000 while
      max |theta' - Omega| -> 4e-12; (3) the dictionary's gamma = I -
      grad theta grad theta^T (adm_dictionary.md:64, rank-one as the
      source argues it) is the induced metric of a spacelike graph in
      Minkowski space, obeying the corresponding Gauss equation
      (checked to 3e-4 against Brioschi), hence a codimension-one flat
      embedding and not a general spatial metric (Janet-Cartan).
      Corrections of record from the 2026-08-22 audit are in the note. Of record without computation: P8 supplies
      Lovelock's general-covariance hypothesis with "SL(2,R) acts
      transitively"; Diff(M) is infinite-dimensional, SL(2,R) is
      three-dimensional, so the hypothesis is not met; and P7's
      "second equation follows from differentiating" was never
      written down in the corpus.
novelty:
  status: unchecked
status: refuted
