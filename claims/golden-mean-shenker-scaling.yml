id: golden-mean-shenker-scaling
statement: >
  For the critical (K = 1) sine circle map at golden-mean winding
  number, the widths of successive mode-locking intervals along the
  Fibonacci approximants scale with Shenker's constant
  delta ~ 2.83361; the corresponding width exponent at criticality is
  ln(delta)/ln(phi) ~ 2.164, not 2.
premises: []
evidence:
