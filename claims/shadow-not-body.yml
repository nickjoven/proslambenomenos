  CHSH picture is exactly a shadow identity and nothing more. The
  bodies: the local CHSH polytope has 16 vertices in affine
  dimension 8; the causal OCB polytope has 2368 vertices in
  affine dimension 24 (both exact, exhaustive, rational) - no
  affine isomorphism exists. The shadows: both classical regions
