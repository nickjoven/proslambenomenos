id: stiffness-is-a-clock
statement: >
  On the P-35/P-36 ring with bond stiffness kappa (theta_dd_j =
  -gamma v_j + kappa (sin D_j - sin D_{j-1}) + f delta_jb), kappa is
  a time unit and nothing else: (1) the state (theta, v) advanced by
  one Euler-Cromer step at (kappa, gamma, f, dt) equals (theta,
  sqrt kappa u) with u advanced at (1, gamma/sqrt kappa, f/kappa,
  sqrt kappa dt), at the floating-point floor (residuals 0.04 to
  0.06 of 32 eps at kappa 0.5, 2, 3 over 120000 states) and bit for
  bit when sqrt kappa is dyadic (kappa 1/4 and 4: zero deviation
  through the slip); at kappa 0.5, 2, 3 the scaled trajectories
  through the slip share their event step and part by 1e-10 on
  phases of 1e4, within the accumulated-rounding bound. So the band
  top 2 sqrt kappa and the rotor speed f/gamma scale together and
  "above the band" is the damping statement f/(gamma sqrt kappa) >
  2. (2) Along the damping ladder that statement names, at kappa =
  1 and gamma in {0.2, 0.35, 0.45, 0.5, 0.6, 0.8} (rotor at Omega
  9.84 down to 2.35, band top 2), the slip footprint's offset-2
  ratio A_2/A_1, demodulated against the rotor's phase, lies in the
  band of the exact discrete evanescent root |w| over the window's
  measured stiffness range, widened by the derived floors, at every
  cell. CORRECTED at R-47a: that agreement is leakage-assisted (the
  rotor reference smears the drive-locked fundamental by the
  neighbour's slow phase wander and admits correlated slow and
  harmonic leakage that offsets a real excess within floors 11 to 24
  percent wide) and is not evidence for the tail law near the band;
  the drive-locked offset-2 amplitude exceeds the linear root by up
  to 27 percent while the slip's long-wavelength relaxation is alive
  in the window, and sits on the band top to 0.1 percent once it has
  decayed (late window, R-47a; the registered line for that is
  P-49). Scope: N = 64 (the falsifier at N = 16); Omega > 2 only; one
  reduced load; clause (2) stands as a measurement of the rotor-
  reference lock-in, not as the tail law.
