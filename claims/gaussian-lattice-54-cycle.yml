    ref: >
      notes/modular_koide_evaluation.md item 5: v1
      hierarchy_gaussian_lattice.md exhibits no map whose orbit has
      size 54 - the "complete pass" is presumed, not constructed; and
      the framework's operative iteration integer 13 has
      multiplicative order 9 both mod 27 and mod 54 (13^9 = 1, no
      smaller power; computed 2026-08-19), so no 13-generated orbit
      passes through 54 cells.
