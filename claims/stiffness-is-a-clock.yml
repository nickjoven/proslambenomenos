null_system: "the identity's residual bound is the floating-point floor scaled by the summands (no fixed number), and the dyadic cells read exactly zero because the arithmetic is identical, which is why the floor-level cells use non-dyadic roots; the tail law's floors are P-46's, computed per run (in-band wave leakage 2a/(T(Omega - 2)), 2-Omega self floor), and the stiffness band is the window's measured [cmin, cmax]; the parametric-resonance candidate (Omega/2 in band for gamma > 0.49, LC-37) was measured and refused - the far field is the slip's overdamped long-wavelength relaxation; the reference was moved to the rotor's phase after the bond phase read the ratio above the band at five cells while the linear-chain anchor at the same frequencies landed on the closed form to 4e-3 - a move R-47a shows to have traded a real excess for a leakage-assisted agreement (L-13: the two estimators owed a decomposition, which P-49's layer performed); mutants kappa-blind (gamma/kappa) and load-blind (f/sqrt kappa) each verified failing at 7e9 and 4e13 of the bound - two different terms of the map (L-13); coverage: the reimplementation carries clause (1) at three kappas and one trajectory and clause (2) at one small cell (N = 16, gamma 0.5) where the two references agree; the six-cell ladder and the bond-reference readings rest on the experiment; a reference-blind mutant does not bite at N = 16 or 32 and is not pinned; coverage (R-47b): clause (1) is a change of units of the map - the check reads the step's homogeneity in kappa and cannot read physics, and clauses (1a) and (2) are its corollaries; the ladder windows at gamma 0.35 to 0.8 lie inside the k = 1 mode's decay time, so every near-band reading in R-47 is a window-state reading (the late window is P-49's); the falsifier's check (3) is the withdrawn rotor-reference clause at N = 16 with the refuted mixing term, and cannot see the leakage-assisted agreement that occurred at N = 64 (gate change queued, A-31)"
