id: quench-counts-share-one-density
statement: >
  On the P-35/P-36 free ring of N = 64 inertial sine-coupled phase
  oscillators with a Langevin bath (gamma = 1) ramped linearly from
  T_i = 2 to 0 over tau_Q in {0, 5, 20, 80, 320}: (1) the
  instantaneous quench's ramp-end count reproduces the equilibrium
  variance N<u^2>_{T_i}/4 pi^2 for both rings (z -0.06 and 0.36; the
  unburnt alternative reads 5.333, 4.2 SE away); (2) at every quench
  rate the twisted ring's probability of freezing on the innermost
  values |W| = 1/2 is the control's density read on the half-integer
  lattice, predicted from the control's variance through the
  equilibrium curve, within its registered band at all five rungs
  (worst 0.85 of a combined standard error; 200 realizations per
  cell); (3) the instantaneous quench holds more winding than the
  slowest (1.94 vs 0.80, at 5.8 combined standard errors).
  Stated, not claimed as results (R-46a): the covariant winding sits
  on its integer or half-integer lattice at every sample (9e-15 worst
  over 2000) and the twisted W^2 never drops below 1/4 - both
  arithmetic; and the twisted ring's VARIANCE read beside the
  control's through the curve at every rung, which is the identity
  map at these temperatures (the lattice moves the variance only
  below width 0.5, the coldest rung freezes at 0.89) and carries no
  lattice content. Scope (R-46b): no Kibble-Zurek exponent is
  claimed - not registered in advance, four points; a weighted
  log-log fit of the control's variance over tau_Q 5 to 320 reads
  -0.178 +- 0.031 (R-46a); the local exponents 0.06 / 0.23 / 0.23
  are reported. One N; one gamma; the unloaded ring. The falsifier
  (LAW-58) carries clause (2)'s inner probability at N = 16 and the
  premise (the twisted bond is a bond) and passes at five seeds.
premises: []
prediction: P-47
evidence:
  - kind: computation
    ref: "scripts/experiments/p47_derive.py with p47_derive.json (the shared density by characteristic-function quadrature, the equilibrium anchor at two temperatures, the N = 32 validation ladder, the powered dt check); scripts/experiments/p47_quench.py with p47_results.json (the registered ladder, seed 20260903); independently reimplemented by scripts/verify/p47_half_sector.py with the density by direct N-fold convolution, its own velocity-Verlet Langevin ring, anchor, floor cell and quench at N = 16"
    method: reimplementation
null_system: "the count has no detector null because it is arithmetic (sum D_j = -sum A_j on a ring); the fast null is the equilibrium variance at T_i, registered on the ramp-end count because the T = 0 descent changes the count after fast quenches (168 of 200 at tau_Q = 0, none at 80 and 320); every band is a model SE from the predicted lattice distribution or a binomial SE from the registered M, with the control's error propagated through the curve; the derive layer's first anchor at T = 0.25 read a degenerate sample from correlated sampling (slips at N e^{-8}) and moved to temperatures where the slip rate decorrelates; a thin dt/2 cell that read a 3-sigma effect was replaced by a powered one that read z = -0.61; the mutants shift-blind (no lattice shift) and count-blind (the unwrapped sum, a topological constant) each verified failing, after a first loosened-check mutant that could not fail was discarded (L-8); coverage (R-46a): clause (c)'s variance sub-clause is the identity map at every registered rung (the lattice moves the variance only below T of about 0.25; the coldest rung freezes at 0.364), so its content is the inner-probability sub-clause; a rigid half-flux on the control (W_tw = W_c + 1/2, no pi bond) lands inside every registered band, so the clause excludes only a twist that shifts T_eff by a third or more; clauses (a) and (d) are arithmetic checked at float precision; the reimplementation carries one rung (tau_Q 20, N = 16, M = 60, the variance) and not (b), (e), the inner probability, N = 64 or the ladder; its pass is seed-dependent (exits 1 at seeds 2 and 4 of six on correct physics) and a ring with the pi bond cut passes it, and neither mutant moves its quench check - gate change queued as A-33; the dt check pairs nothing and bounds a discretisation effect at fifty percent; LAW-58 (A-33): the falsifier's floor cell now decorrelates (T = 0.3, 50-unit gap), its anchor and floor tolerances carry the effective sample count and the control's propagated error, its quench check reads the inner probability so shift-blind dies there (z 4.4), and a premise mutant cut-seam is caught by a strain-variance check on the twisted bond (ratio 4.6); passes at seeds 4747, 2, 4, 7 and 11"
falsifier: "scripts/verify/p47_half_sector.py --mutant cut-seam"
novelty:
  status: classical
  citation: "the shared density is the transfer-matrix bookkeeping of a ring with a gauge twist; the winding-number variance as the defect count follows Das-Sabbatini-Zurek (Sci. Rep. 2, 352, 2012) and the annular-junction fluxon counts of Monaco-Mygind-Rivers (PRL 89, 080603, 2002), both at LC-36; the contribution is the exact half-sector counter applied through a quench with the twisted statistics predicted from the control's, and the refusal to register an exponent the ladder cannot pin"
status: verified
