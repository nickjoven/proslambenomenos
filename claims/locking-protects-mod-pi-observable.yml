id: locking-protects-mod-pi-observable
statement: >
  For the two-photon locked phase at zero detuning (dtheta/dt =
  -eps sin 2 theta plus white noise D), the mod-pi alignment
  observable <cos 2 theta> sits on the derived von Mises
  equilibrium I1(kappa)/I0(kappa) with kappa = eps/(2D), while
  noise-driven pi-hops scramble the bare phase to its derived null
  <cos theta> = 0. Registered on fresh seeds after R-17 killed the
  underived version: ensemble means 0.76468/0.69819/0.63334 against
  pins 0.76500/0.69777/0.63472 at D = 0.2/0.25/0.3 (worst cell 1.23
  SEM), bare-phase means inside their 4-SEM bands around zero, at
  least 65 committed pi-hops per ensemble member. This is the
  classical skeleton of the PRB 111, 184519 statement that locking
  preserves squeezing: the reference pins exactly the observable
  that is defined mod pi, and the surviving Z2 freedom does not
  degrade it. Scope: stationary averages only, dimensionless,
  classical; no quantum observable is computed.
premises: []
prediction: P-23
evidence:
  - kind: computation
    ref: "scripts/experiments/p23_derive.py (Bessel ratio by the continued fraction and by von Mises quadrature to 1e-12; the cos theta null by symmetry; hop budgets; pins in p23_registration.json); scripts/experiments/p23_protect.py with p23_results.json (fresh-seeded ensembles, M = 8 per cell); independently reimplemented by scripts/verify/p22_locking_skeleton.py which recomputes the Bessel ratio and the ensemble live with its own integrator and different seeds"
    method: reimplementation
null_system: "the null is D-independence: if the alignment were a property of locking per se it would not move with noise; the derived and measured equilibrium follows the Bessel ratio of eps/2D across the ladder (0.765 to 0.633), and the bessel-blind mutant that asserts D-independence dies on exactly this motion"
falsifier: "scripts/verify/p22_locking_skeleton.py --mutant bessel-blind"
novelty:
  status: classical
  citation: "the stationary von Mises distribution for a Brownian phase in a periodic potential is textbook (Risken, The Fokker-Planck Equation); the framing as the classical skeleton of squeezed-state phase locking follows PRB 111, 184519"
status: verified
