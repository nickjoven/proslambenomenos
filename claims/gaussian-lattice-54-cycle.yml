id: gaussian-lattice-54-cycle
statement: >
  Claim (v1's, recorded for the refutation): the framework's
  coarse-graining iteration visits each of the q2 * q3^3 = 54 gauge
  cells exactly once, so the hierarchy exponent n = 54 is forced by
  completeness of a single pass.
premises: []
evidence:
