id: mediant-adjacency
statement: >
  If a/b and c/d are adjacent in a Farey sequence (bc - ad = 1), then the
  mediant (a+c)/(b+d) is the unique fraction of minimal denominator
  strictly between them, and insertion preserves the determinant
  condition on both new pairs. Down every edge of the Stern-Brocot tree
  p+q strictly increases, and the left/right turn run-lengths of the
  path to p/q are the continued-fraction expansion of p/q.
