id: classical-gravity-squeeze-windows
statement: >
  Oppenheim's postquantum classical gravity lives inside a two-sided
  squeeze on the spacetime diffusion D2 (interferometric coherence
  below, force noise above; OSSW eqs. 44/46/47), and the computed
  window table over kernel class, inclusion rule and lower-bound
  convention decomposes into robust and source-precision-fragile
  verdicts. Robust under BOTH the sources' printed bounds and the
  same bounds recomputed from their own stated inputs (which differ
  by +2.26/-1.35/+1.65 orders on the upper side while the lower
  bounds reproduce exactly): the ultra-local continuous class is
  excluded under every inclusion rule (window -17.0 to -41.6
  orders); the ultra-local discrete class survives the uncontested
  direct-on-Earth rule (+9.5 to +10.8 orders through the Gisler
  nanowire row, FOM 0.298 of Janse Table I, itself audited to
  internal consistency at 46 of 46 rows on two identities with one
  composition inconsistency recorded); the nonlocal continuous
  class survives every rule with margin at least +4.3 outside one
  cell. FRAGILE, and recorded as undecidable at source precision
  (R-24's fired sign-stability clause): all three verdicts in the
  contested atom-interferometry rows flip sign between printed and
  recomputed arithmetic (discrete -0.62 to +0.73, discrete/Fein
  -1.11 to +0.24, nonlocal/Janse-convention +1.38 to -0.27), so
  whether Asenbaum-class data closes the discrete window is not
  determined by the sources' own order-of-magnitude arithmetic -
  independently of the imported, unresolved question of whether
  differential measurements bound D2 at all. Closure figures of
  merit: the discrete class shuts at FOM = 1e-10 m^2 s^-3 from an
  uncontested absolute measurement (best current: 3e-1), the
  nonlocal class at 1e-17 (OSSW lower-bound convention) or 1e-12
  (Janse's underivable 1e-35). Scope: the Newtonian-limit squeezes
  as printed; no ruling on the differential-measurement question,
  no ruling on the theory's viability, non-gravitational hybrid
  models untouched.
